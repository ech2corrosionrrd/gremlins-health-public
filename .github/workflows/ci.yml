name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # conftest.py задає власні тестові налаштування, тож .env не потрібен.
      - name: Run tests
        run: python -m pytest -v

      # Регресії безпеки блокують реліз, тож у них окремий крок:
      # падіння тут видно в підсумку задачі без здогадок.
      - name: Security regression suite
        run: python -m pytest tests/test_security.py -v

      - name: Verify migrations match the models
        env:
          SECRET_KEY: ci-only-secret-key-that-is-long-enough-000000
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Mini App build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/telegram-mini-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/telegram-mini-app/package-lock.json

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on committed .env or bot tokens
        run: |
          if git ls-files --error-unmatch backend/.env 2>/dev/null; then
            echo "::error::backend/.env is tracked by git"
            exit 1
          fi
          # Токен Telegram-бота має вигляд <цифри>:<35 символів base64url>
          if git grep -nIE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' -- \
               ':!*.md' ':!.github/*' > /tmp/hits 2>/dev/null; then
            echo "::error::possible Telegram bot token committed"
            cat /tmp/hits
            exit 1
          fi
          echo "No committed secrets found."
