# Host-level nginx for a bare-metal (non-Docker) deployment.
# For the Docker stack the frontend container already serves this role -
# see apps/telegram-mini-app/nginx.conf.
#
# Obtain certificates first:
#   certbot --nginx -d your-domain.example

# Rate limit at the edge as well as in the app.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name your-domain.example;

    # ACME challenges must stay on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Telegram embeds the Mini App in an iframe, so allow only its origins.
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org" always;

    client_max_body_size 12m;

    # Static Mini App build output (npm run build).
    root /var/www/gremlins-health/apps/telegram-mini-app/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app reads this; TRUSTED_PROXY_COUNT must be 1 to match.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /docs is disabled by the app in production; nothing is proxied here.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
