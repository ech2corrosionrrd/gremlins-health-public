# Anchor workspace root. Without this file `anchor build` cannot resolve the
# programs directory and the build fails before compiling anything.
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true      # arithmetic overflow must abort, not wrap
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
